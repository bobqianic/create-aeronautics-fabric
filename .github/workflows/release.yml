name: Release
on: [workflow_dispatch] # Manual trigger

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/openjdk/jdk:21-ubuntu
      options: --user root
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew
      - name: Build four-in-one Fabric JAR
        run: ./gradlew build4In1Jar
      - name: Upload four-in-one JAR
        uses: actions/upload-artifact@v4
        with:
          name: create-aeronautics-4in1
          path: build/libs/create-aeronautics-4in1-*.jar
          if-no-files-found: error
